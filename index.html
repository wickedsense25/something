<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Workout Tracker</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #252525;
  --surface3: #303030;
  --primary: #4fc3f7;
  --orange: #ff9800;
  --orange-dim: #e65100;
  --green: #66bb6a;
  --red: #ef5350;
  --text: #e0e0e0;
  --text2: #9e9e9e;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ── Pages ── */
.page { display: none; padding: 16px; padding-bottom: 80px; min-height: 100dvh; }
.page.active { display: block; }

/* ── Nav ── */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--surface2);
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav button {
  flex: 1; background: none; border: none; color: var(--text2);
  padding: 10px 0 8px; font-size: 11px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav button.active { color: var(--primary); }
.nav button svg { width: 24px; height: 24px; }

/* ── Common ── */
h1 { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
.card {
  background: var(--surface); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; padding: 12px 20px;
  cursor: pointer; transition: transform .1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #000; }
.btn-green { background: var(--green); color: #000; }
.btn-red { background: var(--red); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--text); }
.btn-block { width: 100%; }

.empty-state { text-align: center; color: var(--text2); padding: 48px 16px; font-size: 15px; }

/* ── Exercise card in workout ── */
.ex-card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.ex-name { font-size: 16px; font-weight: 700; color: var(--primary); }
.ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ex-prev {
  background: var(--surface2); border-radius: 8px; padding: 8px 10px;
  margin-bottom: 10px; font-size: 13px; color: var(--text2);
}
.ex-prev-date { color: var(--orange); font-weight: 600; margin-bottom: 2px; }
.ex-sets-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.set-chip {
  background: var(--surface2); border-radius: 8px;
  padding: 6px 10px; font-size: 14px; cursor: pointer;
  transition: background .15s;
}
.set-chip:active { background: var(--red); }
.set-chip .sw { color: var(--orange); font-weight: 600; }
.set-chip .sr { color: var(--text); }

.del-btn {
  background: none; border: none; color: var(--red);
  font-size: 20px; cursor: pointer; padding: 2px 6px; opacity: .6;
}

/* ── Exercise picker modal ── */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px 16px 0 0;
  padding: 20px 16px; width: 100%; max-width: 500px;
  max-height: 75vh; overflow-y: auto;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
.modal h2 { font-size: 18px; margin-bottom: 14px; }
.ex-list-item {
  padding: 12px; border-radius: 8px; cursor: pointer;
  font-size: 15px; transition: background .15s;
}
.ex-list-item:active { background: var(--surface2); }
.ex-list-item + .ex-list-item { border-top: 1px solid var(--surface2); }
.search-input {
  background: var(--surface2); border: 1px solid transparent;
  border-radius: 8px; color: var(--text); font-size: 15px;
  padding: 10px 12px; width: 100%; outline: none;
  margin-bottom: 12px;
}
.search-input:focus { border-color: var(--primary); }
.search-input::placeholder { color: var(--text2); }

/* ── Add Set screen (fullscreen overlay) ── */
.addset-screen {
  display: none; position: fixed; inset: 0;
  background: var(--bg); z-index: 300;
  flex-direction: column;
}
.addset-screen.open { display: flex; }

.addset-header {
  padding: 12px 16px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--surface2);
}
.addset-header h3 { font-size: 16px; font-weight: 600; }
.addset-back {
  background: none; border: none; color: var(--primary);
  font-size: 15px; cursor: pointer; padding: 4px 8px;
}

.addset-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Weight section (top half) */
.weight-section {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 16px;
}
.weight-adjust-row {
  display: flex; gap: 10px; margin: 10px 0;
}
.weight-adj {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--surface3);
  color: var(--text); font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: background .15s;
}
.weight-adj:active { background: var(--orange-dim); border-color: var(--orange); }
.weight-adj.dec { color: var(--red); }
.weight-adj.inc { color: var(--green); }

.weight-display {
  font-size: 56px; font-weight: 700; color: var(--orange);
  text-align: center; font-variant-numeric: tabular-nums;
}
.weight-input {
  background: transparent; border: none; border-bottom: 2px solid var(--orange);
  color: var(--orange); font-size: 56px; font-weight: 700;
  text-align: center; width: 160px; outline: none;
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.weight-input::-webkit-inner-spin-button,
.weight-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.weight-label { font-size: 16px; color: var(--text2); margin-top: 2px; }

/* Reps section (bottom half) */
.reps-section {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 16px; border-top: 1px solid var(--surface2);
}
.reps-label { font-size: 14px; color: var(--text2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
.reps-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; width: 100%; max-width: 300px;
}
.rep-btn {
  aspect-ratio: 1; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--surface3);
  color: var(--text); font-size: 18px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: background .15s, transform .1s;
}
.rep-btn:active { background: var(--primary); color: #000; transform: scale(0.93); }

/* ── History ── */
.hist-card { cursor: pointer; }
.hist-card:active { background: var(--surface2); }
.hist-num { font-weight: 700; color: var(--primary); }
.hist-date { color: var(--text2); font-size: 13px; }
.hist-exercises { font-size: 13px; color: var(--text2); margin-top: 4px; }
.hist-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface2); }
.hist-detail.open { display: block; }
.hist-ex-name { font-weight: 600; font-size: 14px; color: var(--primary); margin-bottom: 4px; }
.hist-ex-sets { font-size: 13px; margin-bottom: 8px; }
.hist-del {
  background: none; border: none; color: var(--red);
  font-size: 13px; cursor: pointer; opacity: .6; padding: 2px 6px;
}

@media (min-width: 500px) {
  .page, .addset-body { max-width: 500px; margin-left: auto; margin-right: auto; }
}
</style>
</head>
<body>

<!-- ════════════ PAGE: HOME ════════════ -->
<div class="page active" id="page-home">
  <h1>Workout Tracker</h1>
  <button class="btn btn-primary btn-block" onclick="startNewWorkout()" id="btnStart" style="margin-bottom:20px">
    Начать тренировку
  </button>
  <h2 style="font-size:16px; color:var(--text2); margin-bottom:12px;">История</h2>
  <div id="homeHistory"></div>
</div>

<!-- ════════════ PAGE: WORKOUT ════════════ -->
<div class="page" id="page-workout">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div>
      <h1 style="margin:0" id="workoutTitle">Тренировка #39</h1>
      <div style="color:var(--text2); font-size:14px;" id="workoutDate">17.02.2026</div>
    </div>
  </div>

  <div id="exerciseList"></div>

  <button class="btn btn-ghost btn-block" onclick="openExercisePicker()" style="margin-bottom:12px">+ Упражнение</button>

  <div style="display:flex; gap:8px">
    <button class="btn btn-green" style="flex:1" onclick="finishWorkout()">Завершить</button>
    <button class="btn btn-red" style="flex:1" onclick="cancelWorkout()">Отменить</button>
  </div>
</div>

<!-- ════════════ PAGE: HISTORY ════════════ -->
<div class="page" id="page-history">
  <h1>История</h1>
  <div id="historyList"></div>
</div>

<!-- ════════════ MODAL: Exercise Picker ════════════ -->
<div class="modal-bg" id="modalPicker">
  <div class="modal">
    <h2>Выбери упражнение</h2>
    <input class="search-input" id="exSearchInput" placeholder="Поиск или новое название..." oninput="filterExercises()">
    <div id="exPickerList"></div>
    <button class="btn btn-primary btn-block" onclick="addCustomExercise()" style="margin-top:12px" id="btnAddCustom">
      + Добавить
    </button>
  </div>
</div>

<!-- ════════════ FULLSCREEN: Add Set ════════════ -->
<div class="addset-screen" id="addSetScreen">
  <div class="addset-header">
    <button class="addset-back" onclick="closeAddSet()">&#8592; Назад</button>
    <h3 id="addSetExName">Exercise</h3>
    <span style="color:var(--text2); font-size:13px" id="addSetInfo">Подход #1</span>
  </div>
  <div class="addset-body">
    <!-- Weight (top half) -->
    <div class="weight-section">
      <div class="weight-adjust-row">
        <button class="weight-adj dec" onclick="adjustWeight(-10)">-10</button>
        <button class="weight-adj dec" onclick="adjustWeight(-5)">-5</button>
        <button class="weight-adj dec" onclick="adjustWeight(-2.5)">-2.5</button>
      </div>
      <input type="number" inputmode="decimal" class="weight-input" id="weightInput" value="0" step="0.5" min="0">
      <div class="weight-label">кг</div>
      <div class="weight-adjust-row">
        <button class="weight-adj inc" onclick="adjustWeight(2.5)">+2.5</button>
        <button class="weight-adj inc" onclick="adjustWeight(5)">+5</button>
        <button class="weight-adj inc" onclick="adjustWeight(10)">+10</button>
      </div>
    </div>
    <!-- Reps (bottom half) -->
    <div class="reps-section">
      <div class="reps-label">Повторения</div>
      <div class="reps-grid" id="repsGrid"></div>
    </div>
  </div>
</div>

<!-- ── Navigation ── -->
<nav class="nav">
  <button class="active" onclick="showPage('home')" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0a1 1 0 01-1-1v-4a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
    Главная
  </button>
  <button onclick="showPage('workout')" data-page="workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="1"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/></svg>
    Тренировка
  </button>
  <button onclick="showPage('history')" data-page="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/><path d="M1 12A11 11 0 0112 1"/></svg>
    История
  </button>
</nav>

<script>
// ═══════════════════════════════════
//  SEED DATA
// ═══════════════════════════════════
const SEED_DATA = [
  {
    id: 1, number: 35, date: '2026-02-03',
    exercises: [
      { name: 'Pull Ups', sets: [{w:0,r:9}] },
      { name: 'Yellow Chest Press', sets: [{w:40,r:15},{w:60,r:15},{w:70,r:8},{w:65,r:7}] },
      { name: 'BB Row', sets: [{w:30,r:15},{w:35,r:15},{w:40,r:15},{w:55,r:12}] },
      { name: 'Dips', sets: [{w:0,r:15},{w:0,r:11},{w:0,r:8}] },
      { name: 'DB Curls', sets: [{w:12,r:15},{w:14,r:11},{w:14,r:8}] },
      { name: 'Abs Crunches', sets: [{w:8,r:15},{w:10,r:15},{w:12,r:15},{w:16,r:8}] }
    ]
  },
  {
    id: 2, number: 36, date: '2026-02-05',
    exercises: [
      { name: 'Chin Ups', sets: [{w:0,r:10},{w:0,r:9},{w:0,r:5}] },
      { name: 'DB Raises', sets: [{w:8,r:15},{w:9,r:15},{w:10,r:12}] },
      { name: 'Deep Kettlebell Squat', sets: [{w:20,r:15},{w:24,r:15},{w:28,r:15},{w:32,r:15}] },
      { name: 'Toes to Bar', sets: [{w:0,r:10},{w:0,r:8},{w:0,r:5}] },
      { name: 'Butterfly 1 hand', sets: [{w:15,r:15},{w:20,r:15},{w:20,r:15}] }
    ]
  },
  {
    id: 3, number: 37, date: '2026-02-10',
    exercises: [
      { name: 'Incline Bench Press', sets: [{w:40,r:15},{w:45,r:15},{w:50,r:12},{w:55,r:9}] },
      { name: 'Black Vertical Traction', sets: [{w:40,r:15},{w:50,r:14},{w:55,r:10},{w:60,r:8}] },
      { name: 'Butterfly 2 hands', sets: [{w:15,r:15},{w:20,r:15},{w:22.5,r:12}] },
      { name: 'DB Curls', sets: [{w:14,r:15},{w:14,r:15},{w:14,r:12},{w:14,r:10}] },
      { name: 'Abs Crunches', sets: [{w:8,r:20}] }
    ]
  },
  {
    id: 4, number: 38, date: '2026-02-12',
    exercises: [
      { name: 'Pull Ups', sets: [{w:0,r:10},{w:0,r:9},{w:0,r:6}] },
      { name: 'Yellow Chest Press', sets: [{w:60,r:15},{w:65,r:13},{w:70,r:9}] },
      { name: 'Yellow Low Row 1 hand', sets: [{w:20,r:15},{w:25,r:13},{w:30,r:8}] },
      { name: 'Squats', sets: [{w:20,r:15},{w:30,r:15},{w:40,r:15},{w:50,r:11}] },
      { name: 'Toes to Bar', sets: [{w:0,r:15},{w:0,r:10},{w:0,r:8}] }
    ]
  }
];

const STORAGE_KEY = 'wt_history';
const CURRENT_KEY = 'wt_current';

// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
let currentWorkout = null; // { number, date, exercises: [{ name, sets: [{w, r}] }] }
let addSetExIdx = -1; // which exercise index we're adding a set for

function getHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveHistory(h) { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }

function saveCurrent() {
  if (currentWorkout) localStorage.setItem(CURRENT_KEY, JSON.stringify(currentWorkout));
  else localStorage.removeItem(CURRENT_KEY);
}
function loadCurrent() {
  try { return JSON.parse(localStorage.getItem(CURRENT_KEY)); } catch { return null; }
}

// Seed on first run
function seedIfNeeded() {
  if (localStorage.getItem(STORAGE_KEY)) return;
  saveHistory(SEED_DATA);
}

// ═══════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.page === name)
  );
  if (name === 'home') renderHome();
  if (name === 'history') renderFullHistory();
  if (name === 'workout') renderWorkout();
}

// ═══════════════════════════════════
//  HOME
// ═══════════════════════════════════
function renderHome() {
  const h = getHistory();
  const el = document.getElementById('homeHistory');
  document.getElementById('btnStart').textContent = currentWorkout ? 'Продолжить тренировку' : 'Начать тренировку';

  if (h.length === 0) {
    el.innerHTML = '<div class="empty-state">Пока нет тренировок</div>';
    return;
  }
  // Show last 5
  el.innerHTML = h.slice(-5).reverse().map((w, i) => historyCardHTML(w, 'home-' + i)).join('');
}

// ═══════════════════════════════════
//  WORKOUT
// ═══════════════════════════════════
function startNewWorkout() {
  if (currentWorkout) { showPage('workout'); return; }
  const h = getHistory();
  const maxNum = h.reduce((m, w) => Math.max(m, w.number || 0), 0);
  const today = new Date();
  currentWorkout = {
    number: maxNum + 1,
    date: fmtDateISO(today),
    exercises: []
  };
  saveCurrent();
  showPage('workout');
}

function renderWorkout() {
  if (!currentWorkout) {
    document.getElementById('exerciseList').innerHTML = '<div class="empty-state">Нажми "Начать тренировку" на главной</div>';
    document.getElementById('workoutTitle').textContent = 'Тренировка';
    document.getElementById('workoutDate').textContent = '';
    return;
  }
  document.getElementById('workoutTitle').textContent = 'Тренировка #' + currentWorkout.number;
  document.getElementById('workoutDate').textContent = fmtDateDisplay(currentWorkout.date);

  const container = document.getElementById('exerciseList');
  if (currentWorkout.exercises.length === 0) {
    container.innerHTML = '<div class="empty-state">Добавь упражнение</div>';
    return;
  }

  const history = getHistory();
  container.innerHTML = currentWorkout.exercises.map((ex, ei) => {
    const prev = findPrevExercise(ex.name, history);
    const setsHTML = ex.sets.map((s, si) =>
      `<div class="set-chip" onclick="deleteSet(${ei},${si})" title="Удалить">` +
        (s.w > 0 ? `<span class="sw">${fmtW(s.w)}</span>&times;` : '') +
        `<span class="sr">${s.r}</span></div>`
    ).join('');

    let prevHTML = '';
    if (prev) {
      const prevSets = prev.sets.map(s =>
        s.w > 0 ? `${fmtW(s.w)}&times;${s.r}` : `${s.r}`
      ).join('&ensp;');
      prevHTML = `<div class="ex-prev"><div class="ex-prev-date">${fmtDateDisplay(prev.date)}</div>${prevSets}</div>`;
    }

    return `<div class="ex-card">
      <div class="ex-header">
        <span class="ex-name">${esc(ex.name)}</span>
        <button class="del-btn" onclick="removeExercise(${ei})">&times;</button>
      </div>
      ${prevHTML}
      <div class="ex-sets-row">${setsHTML}</div>
      <button class="btn btn-ghost btn-block" onclick="openAddSet(${ei})" style="font-size:14px">+ Подход</button>
    </div>`;
  }).join('');
}

function removeExercise(ei) {
  currentWorkout.exercises.splice(ei, 1);
  saveCurrent();
  renderWorkout();
}

function deleteSet(ei, si) {
  if (!confirm('Удалить этот подход?')) return;
  currentWorkout.exercises[ei].sets.splice(si, 1);
  saveCurrent();
  renderWorkout();
}

function finishWorkout() {
  if (!currentWorkout) return;
  const valid = currentWorkout.exercises.filter(e => e.sets.length > 0);
  if (valid.length === 0) {
    if (confirm('Нет подходов. Отменить тренировку?')) cancelWorkout();
    return;
  }
  const workout = {
    id: Date.now(),
    number: currentWorkout.number,
    date: currentWorkout.date,
    exercises: valid
  };
  const h = getHistory();
  h.push(workout);
  saveHistory(h);
  currentWorkout = null;
  saveCurrent();
  showPage('home');
}

function cancelWorkout() {
  if (currentWorkout && currentWorkout.exercises.some(e => e.sets.length > 0)) {
    if (!confirm('Отменить тренировку? Данные не сохранятся.')) return;
  }
  currentWorkout = null;
  saveCurrent();
  showPage('home');
}

// ═══════════════════════════════════
//  EXERCISE PICKER
// ═══════════════════════════════════
function openExercisePicker() {
  if (!currentWorkout) return;
  document.getElementById('exSearchInput').value = '';
  renderExercisePickerList('');
  document.getElementById('modalPicker').classList.add('open');
  setTimeout(() => document.getElementById('exSearchInput').focus(), 100);
}

function filterExercises() {
  renderExercisePickerList(document.getElementById('exSearchInput').value);
}

function renderExercisePickerList(query) {
  const history = getHistory();
  const names = new Set();
  history.forEach(w => w.exercises.forEach(e => names.add(e.name)));
  let list = [...names].sort();
  const q = query.trim().toLowerCase();
  if (q) list = list.filter(n => n.toLowerCase().includes(q));

  const el = document.getElementById('exPickerList');
  el.innerHTML = list.map(n =>
    `<div class="ex-list-item" onclick="pickExercise('${esc(n)}')">${esc(n)}</div>`
  ).join('');

  // Show/hide add button
  const exact = list.find(n => n.toLowerCase() === q);
  const addBtn = document.getElementById('btnAddCustom');
  addBtn.style.display = (q && !exact) ? 'block' : 'none';
}

function pickExercise(name) {
  currentWorkout.exercises.push({ name, sets: [] });
  saveCurrent();
  document.getElementById('modalPicker').classList.remove('open');
  renderWorkout();
}

function addCustomExercise() {
  const name = document.getElementById('exSearchInput').value.trim();
  if (!name) return;
  pickExercise(name);
}

// close modal on overlay click
document.getElementById('modalPicker').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

// ═══════════════════════════════════
//  ADD SET SCREEN
// ═══════════════════════════════════
function openAddSet(exIdx) {
  addSetExIdx = exIdx;
  const ex = currentWorkout.exercises[exIdx];
  document.getElementById('addSetExName').textContent = ex.name;
  document.getElementById('addSetInfo').textContent = 'Подход #' + (ex.sets.length + 1);

  // Default weight: from last set in current workout, or from history
  let defaultW = 0;
  if (ex.sets.length > 0) {
    defaultW = ex.sets[ex.sets.length - 1].w;
  } else {
    const prev = findPrevExercise(ex.name, getHistory());
    if (prev && prev.sets.length > 0) {
      defaultW = prev.sets[0].w;
    }
  }
  document.getElementById('weightInput').value = defaultW;

  // Build reps grid (4-20)
  const grid = document.getElementById('repsGrid');
  grid.innerHTML = '';
  for (let i = 4; i <= 20; i++) {
    const btn = document.createElement('button');
    btn.className = 'rep-btn';
    btn.textContent = i;
    btn.onclick = () => confirmSet(i);
    grid.appendChild(btn);
  }

  document.getElementById('addSetScreen').classList.add('open');
}

function closeAddSet() {
  document.getElementById('addSetScreen').classList.remove('open');
}

function adjustWeight(delta) {
  const inp = document.getElementById('weightInput');
  let val = parseFloat(inp.value) || 0;
  val = Math.max(0, val + delta);
  // Round to avoid floating point issues
  val = Math.round(val * 10) / 10;
  inp.value = val;
}

function confirmSet(reps) {
  const w = parseFloat(document.getElementById('weightInput').value) || 0;
  currentWorkout.exercises[addSetExIdx].sets.push({ w, r: reps });
  saveCurrent();
  if ('vibrate' in navigator) navigator.vibrate(10);
  closeAddSet();
  renderWorkout();
}

// ═══════════════════════════════════
//  HISTORY PAGE
// ═══════════════════════════════════
function renderFullHistory() {
  const h = getHistory();
  const el = document.getElementById('historyList');
  if (h.length === 0) {
    el.innerHTML = '<div class="empty-state">Пока нет тренировок</div>';
    return;
  }
  el.innerHTML = [...h].reverse().map((w, i) => historyCardHTML(w, 'hist-' + i, true)).join('');
}

function historyCardHTML(w, idPrefix, showDelete) {
  const exNames = w.exercises.map(e => e.name).join(', ');
  let detailHTML = w.exercises.map(ex => {
    const setsStr = ex.sets.map(s =>
      s.w > 0 ? `${fmtW(s.w)}&times;${s.r}` : `${s.r}`
    ).join('&ensp;');
    return `<div class="hist-ex-name">${esc(ex.name)}</div><div class="hist-ex-sets">${setsStr}</div>`;
  }).join('');

  const delHTML = showDelete
    ? `<button class="hist-del" onclick="event.stopPropagation(); deleteHistoryWorkout(${w.id})">удалить</button>`
    : '';

  return `<div class="card hist-card" onclick="toggleDetail('${idPrefix}')">
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div>
        <span class="hist-num">Тренировка #${w.number}</span>
        <span class="hist-date">&mdash; ${fmtDateDisplay(w.date)}</span>
      </div>
      ${delHTML}
    </div>
    <div class="hist-exercises">${esc(exNames)}</div>
    <div class="hist-detail" id="${idPrefix}">${detailHTML}</div>
  </div>`;
}

function toggleDetail(id) {
  document.getElementById(id).classList.toggle('open');
}

function deleteHistoryWorkout(id) {
  if (!confirm('Удалить эту тренировку из истории?')) return;
  let h = getHistory().filter(w => w.id !== id);
  saveHistory(h);
  renderFullHistory();
}

// ═══════════════════════════════════
//  HELPERS
// ═══════════════════════════════════
function findPrevExercise(name, history) {
  const lower = name.toLowerCase();
  // Search from most recent to oldest
  for (let i = history.length - 1; i >= 0; i--) {
    const w = history[i];
    const ex = w.exercises.find(e => e.name.toLowerCase() === lower);
    if (ex) return { date: w.date, sets: ex.sets };
  }
  return null;
}

function fmtDateISO(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function fmtDateDisplay(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function fmtW(w) {
  return w % 1 === 0 ? w : w.toFixed(1);
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ═══════════════════════════════════
//  INIT
// ═══════════════════════════════════
seedIfNeeded();
currentWorkout = loadCurrent();
renderHome();
</script>
