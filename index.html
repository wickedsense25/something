<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Workout Tracker</title>
<style>
:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #252525;
  --surface3: #303030;
  --primary: #4fc3f7;
  --orange: #ff9800;
  --orange-dim: #e65100;
  --green: #66bb6a;
  --red: #ef5350;
  --text: #e0e0e0;
  --text2: #9e9e9e;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100dvh; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

.page { display: none; padding: 16px; padding-bottom: 80px; min-height: 100dvh; }
.page.active { display: block; }

.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--surface2); z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav button {
  flex: 1; background: none; border: none; color: var(--text2);
  padding: 10px 0 8px; font-size: 11px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.nav button.active { color: var(--primary); }
.nav button svg { width: 24px; height: 24px; }

h1 { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; padding: 12px 20px;
  cursor: pointer; transition: transform .1s;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--primary); color: #000; }
.btn-green { background: var(--green); color: #000; }
.btn-red { background: var(--red); color: #fff; }
.btn-ghost { background: var(--surface2); color: var(--text); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 14px; font-size: 13px; }

.empty-state { text-align: center; color: var(--text2); padding: 48px 16px; font-size: 15px; }

/* Exercise card */
.ex-card { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.ex-name { font-size: 16px; font-weight: 700; color: var(--primary); }
.ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.ex-prev {
  background: var(--surface2); border-radius: 8px; padding: 8px 10px;
  margin-bottom: 10px; font-size: 13px; color: var(--text2);
}
.ex-prev-date { color: var(--orange); font-weight: 600; margin-bottom: 2px; }
.ex-sets-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.set-chip {
  background: var(--surface2); border-radius: 8px;
  padding: 6px 10px; font-size: 14px; cursor: pointer;
  transition: background .15s;
}
.set-chip:active { background: var(--red); }
.set-chip .sw { color: var(--orange); font-weight: 600; }
.set-chip .sr { color: var(--text); }
.del-btn {
  background: none; border: none; color: var(--red);
  font-size: 20px; cursor: pointer; padding: 2px 6px; opacity: .6;
}

/* Exercise picker */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px 16px 0 0;
  padding: 20px 16px; width: 100%; max-width: 500px;
  max-height: 75vh; overflow-y: auto;
  padding-bottom: calc(20px + env(safe-area-inset-bottom));
}
.modal h2 { font-size: 18px; margin-bottom: 14px; }
.ex-list-item {
  padding: 12px; border-radius: 8px; cursor: pointer;
  font-size: 15px; transition: background .15s;
}
.ex-list-item:active { background: var(--surface2); }
.ex-list-item + .ex-list-item { border-top: 1px solid var(--surface2); }
.search-input {
  background: var(--surface2); border: 1px solid transparent;
  border-radius: 8px; color: var(--text); font-size: 15px;
  padding: 10px 12px; width: 100%; outline: none; margin-bottom: 12px;
}
.search-input:focus { border-color: var(--primary); }
.search-input::placeholder { color: var(--text2); }

/* Add Set fullscreen */
.addset-screen {
  display: none; position: fixed; inset: 0;
  background: var(--bg); z-index: 300; flex-direction: column;
}
.addset-screen.open { display: flex; }
.addset-header {
  padding: 12px 16px; display: flex; align-items: center;
  justify-content: space-between; border-bottom: 1px solid var(--surface2);
  flex-shrink: 0;
}
.addset-header h3 { font-size: 16px; font-weight: 600; }
.addset-back {
  background: none; border: none; color: var(--primary);
  font-size: 15px; cursor: pointer; padding: 4px 8px;
}
.addset-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Last set info */
.last-set-info {
  background: var(--surface); border-radius: 8px; padding: 8px 12px;
  margin: 8px 16px 0; font-size: 14px; color: var(--text2);
  flex-shrink: 0;
}
.last-set-info .last-set-val { color: var(--green); font-weight: 700; }
.last-set-info .prev-date { color: var(--orange); font-weight: 600; font-size: 12px; }
.last-set-row { display: flex; align-items: center; gap: 8px; }
.last-set-content { flex: 1; min-width: 0; text-align: center; }
.del-last-set {
  background: none; border: none; color: var(--red);
  font-size: 18px; cursor: pointer; padding: 0 2px;
  opacity: 0.6; flex-shrink: 0;
}

/* Weight section */
.weight-section {
  flex: 3; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 12px 16px;
}
.weight-adjust-row { display: flex; gap: 8px; margin: 8px 0; }
.weight-adj {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--surface2); border: 2px solid var(--surface3);
  color: var(--text); font-size: 13px; font-weight: 600;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: background .15s;
}
.weight-adj:active { background: var(--orange-dim); border-color: var(--orange); }
.weight-adj.dec { color: var(--red); }
.weight-adj.inc { color: var(--green); }
.weight-input {
  background: transparent; border: none; border-bottom: 2px solid var(--orange);
  color: var(--orange); font-size: 48px; font-weight: 700;
  text-align: center; width: 150px; outline: none;
  font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
.weight-input::-webkit-inner-spin-button,
.weight-input::-webkit-outer-spin-button { -webkit-appearance: none; }
.weight-label { font-size: 14px; color: var(--text2); margin-top: 2px; }

/* Reps section */
.reps-section {
  flex: 5; display: flex; flex-direction: column;
  padding: 12px 16px; border-top: 1px solid var(--surface2);
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  min-height: 0;
}
.reps-top {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px; flex-shrink: 0;
}
.reps-label { font-size: 13px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.reps-staging {
  font-size: 28px; font-weight: 700; color: var(--primary);
  min-width: 40px; text-align: right;
  font-variant-numeric: tabular-nums;
}
.reps-staging.empty { color: var(--text2); font-size: 20px; }
.reps-staging.compound { color: var(--orange); }

.reps-grid {
  display: grid;
  grid-template-rows: repeat(5, 1fr);
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 6px;
  flex: 1; min-height: 0;
  width: 100%; max-width: 340px;
  align-self: center;
}
.rep-btn {
  border-radius: 50%; aspect-ratio: 1;
  background: var(--surface2); border: 2px solid var(--surface3);
  color: var(--text); font-size: 17px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center;
  justify-content: center; transition: background .15s, transform .1s;
  max-height: 58px;
}
.rep-btn:active { background: var(--primary); color: #000; transform: scale(0.93); }
.rep-btn.custom-rep {
  font-size: 13px; color: var(--text2);
}
.rep-btn.plus-btn {
  color: var(--orange); font-size: 22px;
  border-color: var(--orange-dim);
}
.rep-btn.plus-btn:active { background: var(--orange); color: #000; }
.rep-btn.finish-btn {
  color: var(--green); font-size: 24px;
  border-color: var(--green);
  background: rgba(102, 187, 106, 0.1);
}
.rep-btn.finish-btn:active { background: var(--green); color: #000; }

/* Animated dots */
.dots-anim { display: inline-block; margin-left: 2px; }
.dots-anim span { opacity: 0; animation: dotPulse 1.4s infinite; }
.dots-anim span:nth-child(1) { animation-delay: 0s; }
.dots-anim span:nth-child(2) { animation-delay: 0.2s; }
.dots-anim span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

/* Toast */
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--green); color: #000;
  padding: 10px 24px; border-radius: 10px; font-weight: 600; font-size: 14px;
  z-index: 500; animation: toastIn .3s ease;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* History */
.hist-card { cursor: pointer; }
.hist-card:active { background: var(--surface2); }
.hist-num { font-weight: 700; color: var(--primary); }
.hist-date { color: var(--text2); font-size: 13px; }
.hist-exercises { font-size: 13px; color: var(--text2); margin-top: 4px; }
.hist-detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--surface2); }
.hist-detail.open { display: block; }
.hist-ex-name { font-weight: 600; font-size: 14px; color: var(--primary); margin-bottom: 4px; }
.hist-ex-sets { font-size: 13px; margin-bottom: 8px; }
.hist-del {
  background: none; border: none; color: var(--red);
  font-size: 13px; cursor: pointer; opacity: .6; padding: 2px 6px;
}
.hist-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

/* Dictionary */
.dict-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0; border-bottom: 1px solid var(--surface2);
  cursor: pointer; font-size: 14px;
}
.dict-item input[type="checkbox"] {
  width: 20px; height: 20px; accent-color: var(--primary); flex-shrink: 0;
}
.dict-name { flex: 1; min-width: 0; }
.dict-count {
  color: var(--text2); font-size: 12px;
  background: var(--surface2); border-radius: 10px;
  padding: 2px 8px; flex-shrink: 0;
}
.dict-merge-names { margin-top: 10px; }
.dict-merge-names .btn { margin-bottom: 6px; text-align: left; justify-content: flex-start; }

/* Text export modal */
.text-modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.65); z-index: 400;
  align-items: center; justify-content: center; padding: 20px;
}
.text-modal.open { display: flex; }
.text-modal-body {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; width: 100%; max-width: 400px;
}
.text-modal-body textarea {
  width: 100%; height: 200px; background: var(--surface2);
  border: none; border-radius: 8px; color: var(--text);
  font-size: 13px; padding: 10px; resize: none; outline: none;
  font-family: inherit; margin-bottom: 10px;
}

/* Settings */
.settings-info { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.5; }
.settings-info b { color: var(--text); }
.settings-connected { color: var(--green); font-weight: 600; margin-bottom: 12px; }
.settings-field { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.settings-syncing { color: var(--orange); font-size: 13px; margin-top: 8px; }
.gear-btn {
  background: none; border: none; color: var(--text2);
  font-size: 22px; cursor: pointer; padding: 4px 8px;
}

@media (min-width: 500px) {
  .page, .addset-body { max-width: 500px; margin-left: auto; margin-right: auto; }
}
</style>
</head>
<body>

<!-- ═══════ PAGE: HOME ═══════ -->
<div class="page active" id="page-home">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h1 style="margin:0">Workout Tracker</h1>
    <button class="gear-btn" onclick="openSettings()">&#9881;</button>
  </div>
  <button class="btn btn-primary btn-block" onclick="startNewWorkout()" id="btnStart" style="margin-bottom:20px">
    Начать тренировку
  </button>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h2 style="font-size:16px; color:var(--text2); margin:0">История</h2>
    <button style="background:none;border:none;color:var(--primary);font-size:13px;cursor:pointer" onclick="openDictionary()">Справочник</button>
  </div>
  <div id="homeHistory"></div>
</div>

<!-- ═══════ PAGE: WORKOUT ═══════ -->
<div class="page" id="page-workout">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
    <div>
      <h1 style="margin:0" id="workoutTitle">Тренировка</h1>
      <div style="color:var(--text2); font-size:14px;" id="workoutDate"></div>
    </div>
  </div>

  <div id="exerciseList"></div>

  <button class="btn btn-ghost btn-block" onclick="openExercisePicker()" style="margin-bottom:12px">+ Упражнение</button>

  <button class="btn btn-ghost btn-block" onclick="exportWorkoutText()" style="margin-bottom:12px" id="btnExport">
    Скопировать текст
  </button>

  <div style="display:flex; gap:8px">
    <button class="btn btn-green" style="flex:1" onclick="finishWorkout()">Завершить</button>
    <button class="btn btn-red" style="flex:1" onclick="cancelWorkout()">Отменить</button>
  </div>
</div>

<!-- ═══════ PAGE: HISTORY ═══════ -->
<div class="page" id="page-history">
  <h1>История</h1>
  <div id="historyList"></div>
</div>

<!-- ═══════ MODAL: Exercise Picker ═══════ -->
<div class="modal-bg" id="modalPicker">
  <div class="modal">
    <h2>Выбери упражнение</h2>
    <input class="search-input" id="exSearchInput" placeholder="Поиск или новое название..." oninput="filterExercises()">
    <div id="exPickerList"></div>
    <button class="btn btn-primary btn-block" onclick="addCustomExercise()" style="margin-top:12px" id="btnAddCustom">
      + Добавить
    </button>
  </div>
</div>

<!-- ═══════ FULLSCREEN: Add Set ═══════ -->
<div class="addset-screen" id="addSetScreen">
  <div class="addset-header">
    <button class="addset-back" onclick="closeAddSet()">&#8592; Назад</button>
    <h3 id="addSetExName">Exercise</h3>
    <span style="color:var(--text2); font-size:13px" id="addSetInfo">Подход #1</span>
  </div>
  <div class="addset-body">
    <div class="last-set-info" id="lastSetInfo" style="display:none"></div>
    <div class="weight-section">
      <div class="weight-adjust-row">
        <button class="weight-adj dec" onclick="adjustWeight(-10)">-10</button>
        <button class="weight-adj dec" onclick="adjustWeight(-5)">-5</button>
        <button class="weight-adj dec" onclick="adjustWeight(-2.5)">-2.5</button>
        <button class="weight-adj dec" onclick="adjustWeight(-2)">-2</button>
      </div>
      <input type="number" inputmode="decimal" class="weight-input" id="weightInput" value="0" step="0.5" min="0">
      <div class="weight-label">кг</div>
      <div class="weight-adjust-row">
        <button class="weight-adj inc" onclick="adjustWeight(2)">+2</button>
        <button class="weight-adj inc" onclick="adjustWeight(2.5)">+2.5</button>
        <button class="weight-adj inc" onclick="adjustWeight(5)">+5</button>
        <button class="weight-adj inc" onclick="adjustWeight(10)">+10</button>
      </div>
    </div>
    <div class="reps-section">
      <div class="reps-top">
        <span class="reps-label">Повторения</span>
        <span class="reps-staging empty" id="repsStaging">&mdash;</span>
      </div>
      <div class="reps-grid" id="repsGrid"></div>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: Settings ═══════ -->
<div class="modal-bg" id="modalSettings">
  <div class="modal">
    <h2>Синхронизация</h2>
    <div id="settingsContent"></div>
  </div>
</div>

<!-- ═══════ MODAL: Exercise Dictionary ═══════ -->
<div class="modal-bg" id="modalDict">
  <div class="modal">
    <h2>Справочник упражнений</h2>
    <input class="search-input" id="dictSearchInput" placeholder="Поиск..." oninput="renderDictionary(this.value)">
    <div id="dictList"></div>
    <div id="dictMergeBar" style="display:none;margin-top:12px">
      <button class="btn btn-primary btn-block" id="dictMergeBtn">Склеить</button>
      <div class="dict-merge-names" id="dictMergeNames" style="display:none"></div>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: Text export fallback ═══════ -->
<div class="text-modal" id="textModal">
  <div class="text-modal-body">
    <textarea id="textModalArea" readonly></textarea>
    <button class="btn btn-primary btn-block" onclick="closeTextModal()">Закрыть</button>
  </div>
</div>

<!-- ═══════ Nav ═══════ -->
<nav class="nav">
  <button class="active" onclick="showPage('home')" data-page="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3m10-11v10a1 1 0 01-1 1h-3m-6 0a1 1 0 01-1-1v-4a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
    Главная
  </button>
  <button onclick="showPage('workout')" data-page="workout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="1"/><line x1="12" y1="7" x2="12" y2="17"/><line x1="7" y1="4" x2="7" y2="20"/><line x1="17" y1="4" x2="17" y2="20"/></svg>
    Тренировка
  </button>
  <button onclick="showPage('history')" data-page="history">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/><path d="M1 12A11 11 0 0112 1"/></svg>
    История
  </button>
</nav>

<script>

const STORAGE_KEY = 'wt_history';
const CURRENT_KEY = 'wt_current';

// ═══════════════════════════════════
//  STATE
// ═══════════════════════════════════
let currentWorkout = null;
let addSetExIdx = -1;
let repsStaging = '';
let compoundMode = false;
let dictSelected = new Set();

function getHistory() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
}
function saveHistory(h) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(h));
  syncToCloud(); // fire-and-forget
}
function saveCurrent() {
  if (currentWorkout) localStorage.setItem(CURRENT_KEY, JSON.stringify(currentWorkout));
  else localStorage.removeItem(CURRENT_KEY);
}
function loadCurrent() {
  try { return JSON.parse(localStorage.getItem(CURRENT_KEY)); } catch { return null; }
}
function seedIfNeeded() {
  if (localStorage.getItem(STORAGE_KEY)) return;
  saveHistory(SEED_DATA);
}

// ═══════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.page === name)
  );
  if (name === 'home') renderHome();
  if (name === 'history') renderFullHistory();
  if (name === 'workout') renderWorkout();
}

// ═══════════════════════════════════
//  HOME
// ═══════════════════════════════════
function renderHome() {
  const h = getHistory();
  const el = document.getElementById('homeHistory');
  document.getElementById('btnStart').textContent = currentWorkout ? 'Продолжить тренировку' : 'Начать тренировку';
  if (h.length === 0) { el.innerHTML = '<div class="empty-state">Пока нет тренировок</div>'; return; }
  el.innerHTML = h.slice(-5).reverse().map((w, i) => historyCardHTML(w, 'home-' + i)).join('');
}

// ═══════════════════════════════════
//  WORKOUT
// ═══════════════════════════════════
function startNewWorkout() {
  if (currentWorkout) { showPage('workout'); return; }
  const h = getHistory();
  const maxNum = h.reduce((m, w) => Math.max(m, w.number || 0), 0);
  currentWorkout = { number: maxNum + 1, date: fmtDateISO(new Date()), exercises: [] };
  saveCurrent();
  showPage('workout');
}

function renderWorkout() {
  if (!currentWorkout) {
    document.getElementById('exerciseList').innerHTML = '<div class="empty-state">Нажми "Начать тренировку" на главной</div>';
    document.getElementById('workoutTitle').textContent = 'Тренировка';
    document.getElementById('workoutDate').textContent = '';
    return;
  }
  document.getElementById('workoutTitle').textContent = 'Тренировка #' + currentWorkout.number;
  document.getElementById('workoutDate').textContent = fmtDateDisplay(currentWorkout.date);

  const container = document.getElementById('exerciseList');
  if (currentWorkout.exercises.length === 0) {
    container.innerHTML = '<div class="empty-state">Добавь упражнение</div>';
    return;
  }

  const history = getHistory();
  container.innerHTML = currentWorkout.exercises.map((ex, ei) => {
    const prev = findPrevExercise(ex.name, history);
    const setsHTML = ex.sets.map((s, si) =>
      `<div class="set-chip" onclick="deleteSet(${ei},${si})" title="Удалить">` +
        (s.w > 0 ? `<span class="sw">${fmtW(s.w)}</span>&times;` : '') +
        `<span class="sr">${s.r}</span></div>`
    ).join('');

    let prevHTML = '';
    if (prev) {
      const prevSets = prev.sets.map(s =>
        s.w > 0 ? `${fmtW(s.w)}&times;${s.r}` : `${s.r}`
      ).join('&ensp;');
      prevHTML = `<div class="ex-prev"><div class="ex-prev-date">${fmtDateDisplay(prev.date)}</div>${prevSets}</div>`;
    }

    return `<div class="ex-card">
      <div class="ex-header">
        <span class="ex-name">${esc(ex.name)}</span>
        <button class="del-btn" onclick="removeExercise(${ei})">&times;</button>
      </div>
      ${prevHTML}
      <div class="ex-sets-row">${setsHTML}</div>
      <button class="btn btn-ghost btn-block" onclick="openAddSet(${ei})" style="font-size:14px">+ Подход</button>
    </div>`;
  }).join('');
}

function removeExercise(ei) {
  currentWorkout.exercises.splice(ei, 1);
  saveCurrent();
  renderWorkout();
}

function deleteSet(ei, si) {
  if (!confirm('Удалить этот подход?')) return;
  currentWorkout.exercises[ei].sets.splice(si, 1);
  saveCurrent();
  renderWorkout();
}

function finishWorkout() {
  if (!currentWorkout) return;
  const valid = currentWorkout.exercises.filter(e => e.sets.length > 0);
  if (valid.length === 0) {
    if (confirm('Нет подходов. Отменить тренировку?')) cancelWorkout();
    return;
  }
  const workout = { id: Date.now(), number: currentWorkout.number, date: currentWorkout.date, exercises: valid };
  const h = getHistory();
  h.push(workout);
  saveHistory(h);
  currentWorkout = null;
  saveCurrent();
  showToast('Тренировка сохранена!');
  showPage('home');
}

function cancelWorkout() {
  if (currentWorkout && currentWorkout.exercises.some(e => e.sets.length > 0)) {
    if (!confirm('Отменить тренировку? Данные не сохранятся.')) return;
  }
  currentWorkout = null;
  saveCurrent();
  showPage('home');
}

// ═══════════════════════════════════
//  TEXT EXPORT
// ═══════════════════════════════════
async function exportWorkoutTextFromData(workout) {
  if (!workout || workout.exercises.length === 0) return;
  const [y, m, d] = workout.date.split('-');
  let text = `Тренировка ${workout.number} - ${d}.${m}\n\n`;

  for (const ex of workout.exercises) {
    if (ex.sets.length === 0) continue;
    const allBW = ex.sets.every(s => !s.w || s.w === 0);
    if (allBW) {
      text += `${ex.name}: ${ex.sets.map(s => s.r).join(', ')}\n`;
    } else {
      text += `${ex.name}: ${ex.sets.map(s =>
        s.w > 0 ? `${fmtW(s.w)}kg x ${s.r}` : `${s.r}`
      ).join(', ')}\n`;
    }
  }

  const trimmed = text.trim();

  if (navigator.share) {
    try { await navigator.share({ text: trimmed }); return; } catch(e) {}
  }
  try {
    await navigator.clipboard.writeText(trimmed);
    showToast('Скопировано!');
    return;
  } catch(e) {}
  showTextModal(trimmed);
}

async function exportWorkoutText() {
  if (!currentWorkout || currentWorkout.exercises.length === 0) return;
  await exportWorkoutTextFromData(currentWorkout);
}

async function exportHistoryWorkout(id) {
  const h = getHistory();
  const workout = h.find(w => w.id === id);
  if (!workout) return;
  await exportWorkoutTextFromData(workout);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function showTextModal(text) {
  document.getElementById('textModalArea').value = text;
  document.getElementById('textModal').classList.add('open');
  document.getElementById('textModalArea').select();
}

function closeTextModal() {
  document.getElementById('textModal').classList.remove('open');
}

document.getElementById('textModal').addEventListener('click', function(e) {
  if (e.target === this) closeTextModal();
});

// ═══════════════════════════════════
//  EXERCISE PICKER
// ═══════════════════════════════════
function openExercisePicker() {
  if (!currentWorkout) return;
  document.getElementById('exSearchInput').value = '';
  renderExercisePickerList('');
  document.getElementById('modalPicker').classList.add('open');
  setTimeout(() => document.getElementById('exSearchInput').focus(), 100);
}

function filterExercises() {
  renderExercisePickerList(document.getElementById('exSearchInput').value);
}

function renderExercisePickerList(query) {
  const history = getHistory();
  const namesMap = new Map();
  history.forEach(w => w.exercises.forEach(e => {
    const norm = normalizeName(e.name);
    if (!namesMap.has(norm)) namesMap.set(norm, e.name);
  }));
  let list = [...namesMap.values()].sort((a, b) => a.localeCompare(b, 'ru'));
  const q = query.trim().toLowerCase();
  if (q) list = list.filter(n => n.toLowerCase().includes(q));

  window._pickerList = list;

  const el = document.getElementById('exPickerList');
  el.innerHTML = list.map((n, i) =>
    `<div class="ex-list-item" onclick="pickExercise(window._pickerList[${i}])">${esc(n)}</div>`
  ).join('');

  const exact = list.find(n => normalizeName(n) === normalizeName(query));
  document.getElementById('btnAddCustom').style.display = (q && !exact) ? 'block' : 'none';
}

function pickExercise(name) {
  currentWorkout.exercises.push({ name, sets: [] });
  saveCurrent();
  document.getElementById('modalPicker').classList.remove('open');
  renderWorkout();
}

function addCustomExercise() {
  const name = document.getElementById('exSearchInput').value.trim();
  if (!name) return;
  pickExercise(name);
}

document.getElementById('modalPicker').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

// ═══════════════════════════════════
//  ADD SET SCREEN
// ═══════════════════════════════════
function openAddSet(exIdx) {
  addSetExIdx = exIdx;
  repsStaging = '';
  compoundMode = false;
  const ex = currentWorkout.exercises[exIdx];
  document.getElementById('addSetExName').textContent = ex.name;
  updateSetCounter();

  let defaultW = 0;
  if (ex.sets.length > 0) {
    defaultW = ex.sets[ex.sets.length - 1].w;
  } else {
    const prev = findPrevExercise(ex.name, getHistory());
    if (prev && prev.sets.length > 0) defaultW = prev.sets[0].w;
  }
  document.getElementById('weightInput').value = defaultW;

  const grid = document.getElementById('repsGrid');
  grid.innerHTML = '';
  for (let i = 4; i <= 20; i++) {
    const btn = document.createElement('button');
    btn.className = 'rep-btn';
    btn.textContent = i;
    btn.onclick = () => tapRep(i);
    grid.appendChild(btn);
  }
  const plusBtn = document.createElement('button');
  plusBtn.className = 'rep-btn plus-btn';
  plusBtn.textContent = '+';
  plusBtn.onclick = tapPlus;
  grid.appendChild(plusBtn);
  const custom = document.createElement('button');
  custom.className = 'rep-btn custom-rep';
  custom.textContent = '...';
  custom.onclick = tapCustomRep;
  grid.appendChild(custom);
  const finishBtn = document.createElement('button');
  finishBtn.className = 'rep-btn finish-btn';
  finishBtn.innerHTML = '&#10003;';
  finishBtn.onclick = finishExercise;
  grid.appendChild(finishBtn);

  updateLastSetInfo();
  renderStaging();
  document.getElementById('addSetScreen').classList.add('open');
}

function closeAddSet() {
  compoundMode = false;
  repsStaging = '';
  document.getElementById('addSetScreen').classList.remove('open');
  renderWorkout();
}

function adjustWeight(delta) {
  const inp = document.getElementById('weightInput');
  let val = parseFloat(inp.value) || 0;
  val = Math.max(0, Math.round((val + delta) * 10) / 10);
  inp.value = val;
}

function updateSetCounter() {
  const ex = currentWorkout.exercises[addSetExIdx];
  document.getElementById('addSetInfo').textContent = 'Подход #' + (ex.sets.length + 1);
}

function updateLastSetInfo() {
  const ex = currentWorkout.exercises[addSetExIdx];
  const el = document.getElementById('lastSetInfo');
  if (ex.sets.length === 0) {
    const prev = findPrevExercise(ex.name, getHistory());
    if (prev) {
      const prevSets = prev.sets.map(s =>
        s.w > 0 ? `${fmtW(s.w)}\u00d7${s.r}` : `${s.r}`
      ).join('  ');
      el.innerHTML = `<span class="prev-date">${fmtDateDisplay(prev.date)}</span><br>${prevSets}`;
      el.style.display = 'block';
    } else {
      el.style.display = 'none';
    }
  } else {
    const setsStr = ex.sets.map(s =>
      s.w > 0 ? `<span class="last-set-val">${fmtW(s.w)}\u00d7${s.r}</span>` : `<span class="last-set-val">${s.r}</span>`
    ).join(', ');
    el.innerHTML = `<div class="last-set-row"><div class="last-set-content">${setsStr}<span class="dots-anim"><span>.</span><span>.</span><span>.</span></span></div><button class="del-last-set" onclick="deleteLastSet()">&times;</button></div>`;
    el.style.display = 'block';
  }
}

function deleteLastSet() {
  const ex = currentWorkout.exercises[addSetExIdx];
  if (ex.sets.length === 0) return;
  ex.sets.pop();
  saveCurrent();
  updateSetCounter();
  updateLastSetInfo();
}

// ═══════════════════════════════════
//  REPS LOGIC
// ═══════════════════════════════════
function tapRep(n) {
  if (compoundMode) {
    if (repsStaging === '' || repsStaging.endsWith('+')) {
      repsStaging += n;
    }
    renderStaging();
    if (repsStaging.includes('+') && /\d$/.test(repsStaging)) {
      recordCurrentSet();
    }
  } else {
    repsStaging = '' + n;
    recordCurrentSet();
  }
}

function tapPlus() {
  if (!compoundMode) {
    compoundMode = true;
    repsStaging = '';
    renderStaging();
  } else {
    if (repsStaging && !repsStaging.endsWith('+')) {
      repsStaging += '+';
      renderStaging();
    }
  }
}

function tapCustomRep() {
  const n = prompt('Количество повторений:');
  if (n !== null && n.trim() && /^\d+$/.test(n.trim())) {
    tapRep(parseInt(n.trim()));
  }
}

function recordCurrentSet() {
  if (!repsStaging || repsStaging.endsWith('+')) return;
  const w = parseFloat(document.getElementById('weightInput').value) || 0;
  currentWorkout.exercises[addSetExIdx].sets.push({ w, r: repsStaging });
  saveCurrent();
  if ('vibrate' in navigator) navigator.vibrate(10);
  showToast('Записано!');

  repsStaging = '';
  compoundMode = false;
  updateSetCounter();
  updateLastSetInfo();
  renderStaging();
}

function finishExercise() {
  if (compoundMode && repsStaging && !repsStaging.endsWith('+')) {
    recordCurrentSet();
  }
  closeAddSet();
}

function renderStaging() {
  const el = document.getElementById('repsStaging');
  el.classList.remove('empty', 'compound');
  if (compoundMode) {
    el.classList.add('compound');
    if (repsStaging) {
      el.textContent = repsStaging;
    } else {
      el.textContent = '+';
    }
  } else {
    el.innerHTML = '&mdash;';
    el.classList.add('empty');
  }
}

// ═══════════════════════════════════
//  HISTORY
// ═══════════════════════════════════
function renderFullHistory() {
  const h = getHistory();
  const el = document.getElementById('historyList');
  if (h.length === 0) { el.innerHTML = '<div class="empty-state">Пока нет тренировок</div>'; return; }
  el.innerHTML = [...h].reverse().map((w, i) => historyCardHTML(w, 'hist-' + i, true)).join('');
}

function historyCardHTML(w, idPrefix, showActions) {
  const exNames = w.exercises.map(e => e.name).join(', ');
  let detailHTML = w.exercises.map(ex => {
    const setsStr = ex.sets.map(s =>
      s.w > 0 ? `${fmtW(s.w)}&times;${s.r}` : `${s.r}`
    ).join('&ensp;');
    return `<div class="hist-ex-name">${esc(ex.name)}</div><div class="hist-ex-sets">${setsStr}</div>`;
  }).join('');

  let actionsHTML = '';
  if (showActions) {
    actionsHTML = `<div class="hist-actions">
      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); exportHistoryWorkout(${w.id})">Скопировать</button>
      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); editHistoryWorkout(${w.id})">Редактировать</button>
      <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="event.stopPropagation(); deleteHistoryWorkout(${w.id})">Удалить</button>
    </div>`;
  }

  return `<div class="card hist-card" onclick="toggleDetail('${idPrefix}')">
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div>
        <span class="hist-num">Тренировка #${w.number}</span>
        <span class="hist-date">&mdash; ${fmtDateDisplay(w.date)}</span>
      </div>
    </div>
    <div class="hist-exercises">${esc(exNames)}</div>
    <div class="hist-detail" id="${idPrefix}">${detailHTML}${actionsHTML}</div>
  </div>`;
}

function toggleDetail(id) { document.getElementById(id).classList.toggle('open'); }

function deleteHistoryWorkout(id) {
  if (!confirm('Удалить эту тренировку из истории?')) return;
  saveHistory(getHistory().filter(w => w.id !== id));
  renderFullHistory();
}

function editHistoryWorkout(id) {
  const h = getHistory();
  const workout = h.find(w => w.id === id);
  if (!workout) return;

  if (currentWorkout) {
    if (!confirm('Сохранить текущую тренировку и открыть выбранную для редактирования?')) return;
    const valid = currentWorkout.exercises.filter(e => e.sets.length > 0);
    if (valid.length > 0) {
      const saved = { id: Date.now(), number: currentWorkout.number, date: currentWorkout.date, exercises: valid };
      const hh = getHistory();
      hh.push(saved);
      saveHistory(hh);
    }
  }

  currentWorkout = {
    number: workout.number,
    date: workout.date,
    exercises: JSON.parse(JSON.stringify(workout.exercises))
  };
  saveHistory(getHistory().filter(w => w.id !== id));
  saveCurrent();
  showPage('workout');
}

// ═══════════════════════════════════
//  EXERCISE DICTIONARY
// ═══════════════════════════════════
function openDictionary() {
  dictSelected.clear();
  document.getElementById('dictSearchInput').value = '';
  document.getElementById('dictMergeNames').style.display = 'none';
  renderDictionary('');
  document.getElementById('modalDict').classList.add('open');
}

function renderDictionary(query) {
  const history = getHistory();
  const exerciseMap = new Map();
  history.forEach(w => {
    const seen = new Set();
    w.exercises.forEach(e => {
      const norm = normalizeName(e.name);
      if (!seen.has(norm)) {
        seen.add(norm);
        if (!exerciseMap.has(norm)) exerciseMap.set(norm, { name: e.name, count: 0 });
        exerciseMap.get(norm).count++;
      }
    });
  });

  let list = [...exerciseMap.values()].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  const q = (query || '').trim().toLowerCase();
  if (q) list = list.filter(item => item.name.toLowerCase().includes(q));

  window._dictItems = list;

  const el = document.getElementById('dictList');
  el.innerHTML = list.map((item, i) => {
    const norm = normalizeName(item.name);
    const checked = dictSelected.has(norm) ? 'checked' : '';
    return `<label class="dict-item">
      <input type="checkbox" ${checked} onchange="toggleDictItem(${i}, this.checked)">
      <span class="dict-name">${esc(item.name)}</span>
      <span class="dict-count">${item.count}</span>
    </label>`;
  }).join('');

  updateDictBar();
}

function toggleDictItem(idx, checked) {
  const norm = normalizeName(window._dictItems[idx].name);
  if (checked) dictSelected.add(norm);
  else dictSelected.delete(norm);
  document.getElementById('dictMergeNames').style.display = 'none';
  updateDictBar();
}

function updateDictBar() {
  const bar = document.getElementById('dictMergeBar');
  const btn = document.getElementById('dictMergeBtn');
  if (dictSelected.size === 1) {
    bar.style.display = 'block';
    btn.textContent = 'Переименовать';
    btn.onclick = renameExercise;
  } else if (dictSelected.size >= 2) {
    bar.style.display = 'block';
    btn.textContent = 'Склеить выбранные (' + dictSelected.size + ')';
    btn.onclick = startMerge;
  } else {
    bar.style.display = 'none';
  }
}

function renameExercise() {
  const items = window._dictItems;
  const selected = items.find(item => dictSelected.has(normalizeName(item.name)));
  if (!selected) return;
  const newName = prompt('Новое название:', selected.name);
  if (!newName || !newName.trim() || newName.trim() === selected.name) return;

  const history = getHistory();
  const oldNorm = normalizeName(selected.name);
  history.forEach(w => {
    w.exercises.forEach(e => {
      if (normalizeName(e.name) === oldNorm) e.name = newName.trim();
    });
  });
  saveHistory(history);

  if (currentWorkout) {
    currentWorkout.exercises.forEach(e => {
      if (normalizeName(e.name) === oldNorm) e.name = newName.trim();
    });
    saveCurrent();
  }

  dictSelected.clear();
  renderDictionary(document.getElementById('dictSearchInput').value);
  showToast('Переименовано!');
}

function startMerge() {
  const items = window._dictItems;
  const selected = items.filter(item => dictSelected.has(normalizeName(item.name)));

  window._mergeSelected = selected;

  const el = document.getElementById('dictMergeNames');
  el.innerHTML = '<div style="font-size:13px;color:var(--text2);margin-bottom:8px">Оставить название:</div>' +
    selected.map((item, i) =>
      `<button class="btn btn-ghost btn-block btn-sm" style="margin-bottom:6px;text-align:left;justify-content:flex-start" onclick="executeMerge(${i})">${esc(item.name)}</button>`
    ).join('');
  el.style.display = 'block';
}

function executeMerge(keepIdx) {
  const keep = window._mergeSelected[keepIdx];
  const others = window._mergeSelected.filter((_, i) => i !== keepIdx);
  const otherNorms = new Set(others.map(o => normalizeName(o.name)));

  const history = getHistory();
  history.forEach(w => {
    w.exercises.forEach(e => {
      if (otherNorms.has(normalizeName(e.name))) e.name = keep.name;
    });
  });
  saveHistory(history);

  if (currentWorkout) {
    currentWorkout.exercises.forEach(e => {
      if (otherNorms.has(normalizeName(e.name))) e.name = keep.name;
    });
    saveCurrent();
  }

  dictSelected.clear();
  document.getElementById('dictMergeNames').style.display = 'none';
  renderDictionary(document.getElementById('dictSearchInput').value);
  showToast('Упражнения объединены!');
}

document.getElementById('modalDict').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});

// ═══════════════════════════════════
//  HELPERS
// ═══════════════════════════════════
function normalizeName(name) {
  return name.trim().replace(/\s+/g, ' ').toLowerCase();
}

function findPrevExercise(name, history) {
  const normalized = normalizeName(name);
  for (let i = history.length - 1; i >= 0; i--) {
    const w = history[i];
    const ex = w.exercises.find(e => normalizeName(e.name) === normalized);
    if (ex) return { date: w.date, sets: ex.sets };
  }
  return null;
}

function fmtDateISO(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtDateDisplay(iso) {
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function fmtW(w) { return w % 1 === 0 ? w : w.toFixed(1); }

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// ═══════════════════════════════════
//  GIST SYNC
// ═══════════════════════════════════
const TOKEN_KEY = 'wt_gh_token';
const GIST_KEY = 'wt_gist_id';
const SYNC_KEY = 'wt_last_sync';

function getToken() { return localStorage.getItem(TOKEN_KEY); }
function getGistId() { return localStorage.getItem(GIST_KEY); }
function isConnected() { return !!(getToken() && getGistId()); }

async function gistRequest(method, path, body) {
  const opts = {
    method,
    headers: {
      'Authorization': `token ${getToken()}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const resp = await fetch(`https://api.github.com${path}`, opts);
  if (!resp.ok) {
    const err = await resp.text().catch(() => '');
    throw new Error(`GitHub API ${resp.status}: ${err}`);
  }
  return resp.json();
}

async function createGist(data) {
  const gist = await gistRequest('POST', '/gists', {
    description: 'Workout Tracker Data',
    public: false,
    files: { 'workouts.json': { content: JSON.stringify(data, null, 2) } }
  });
  return gist.id;
}

async function loadGistData() {
  const gist = await gistRequest('GET', `/gists/${getGistId()}`);
  const content = gist.files['workouts.json']?.content;
  return content ? JSON.parse(content) : null;
}

async function updateGistData(data) {
  await gistRequest('PATCH', `/gists/${getGistId()}`, {
    files: { 'workouts.json': { content: JSON.stringify(data, null, 2) } }
  });
}

async function syncToCloud() {
  if (!isConnected()) return;
  try {
    await updateGistData(getHistory());
    localStorage.setItem(SYNC_KEY, new Date().toISOString());
  } catch(e) { console.error('Sync push failed:', e); }
}

async function syncFromCloud() {
  if (!isConnected()) return;
  try {
    const remote = await loadGistData();
    if (remote && remote.length > 0) {
      const local = getHistory();
      const merged = new Map();
      local.forEach(w => merged.set(w.id, w));
      remote.forEach(w => merged.set(w.id, w));
      const result = [...merged.values()].sort((a, b) => a.date.localeCompare(b.date));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(result));
      localStorage.setItem(SYNC_KEY, new Date().toISOString());
      const active = document.querySelector('.page.active');
      if (active) showPage(active.id.replace('page-', ''));
    }
  } catch(e) { console.error('Sync pull failed:', e); }
}

// ── Settings UI ──
function openSettings() {
  renderSettings();
  document.getElementById('modalSettings').classList.add('open');
}

function renderSettings() {
  const el = document.getElementById('settingsContent');
  if (!isConnected()) {
    el.innerHTML = `
      <div class="settings-info">
        Создай <b>Personal Access Token (classic)</b> на GitHub:<br>
        Settings &rarr; Developer settings &rarr; Personal access tokens &rarr; Tokens (classic) &rarr; Generate new token<br>
        Отметь только <b>gist</b>
      </div>
      <input class="search-input" id="ghTokenInput" type="password" placeholder="ghp_xxxxxxxxxxxx">
      <button class="btn btn-primary btn-block" onclick="connectGist()" id="btnConnect" style="margin-top:8px">Подключить</button>
      <div id="settingsError" style="color:var(--red);font-size:13px;margin-top:8px"></div>
    `;
  } else {
    const last = localStorage.getItem(SYNC_KEY);
    const syncStr = last ? new Date(last).toLocaleString('ru-RU') : 'никогда';
    el.innerHTML = `
      <div class="settings-connected">Подключено</div>
      <div class="settings-field">Gist: ${getGistId().slice(0,12)}...</div>
      <div class="settings-field" style="margin-bottom:16px">Синхронизация: ${syncStr}</div>
      <button class="btn btn-primary btn-block" onclick="manualPull()" style="margin-bottom:8px">Загрузить из облака</button>
      <button class="btn btn-ghost btn-block" onclick="manualPush()" style="margin-bottom:8px">Выгрузить в облако</button>
      <button class="btn btn-red btn-block" onclick="disconnectGist()">Отключить</button>
      <div id="settingsStatus" class="settings-syncing" style="display:none"></div>
    `;
  }
}

async function connectGist() {
  const token = document.getElementById('ghTokenInput').value.trim();
  if (!token) return;
  const errEl = document.getElementById('settingsError');
  const btn = document.getElementById('btnConnect');
  btn.disabled = true;
  errEl.textContent = 'Проверяю токен...';
  errEl.style.color = 'var(--orange)';
  try {
    localStorage.setItem(TOKEN_KEY, token);
    await gistRequest('GET', '/user');
    errEl.textContent = 'Создаю хранилище...';
    const gistId = await createGist(getHistory());
    localStorage.setItem(GIST_KEY, gistId);
    localStorage.setItem(SYNC_KEY, new Date().toISOString());
    renderSettings();
    showToast('Подключено!');
  } catch(e) {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(GIST_KEY);
    errEl.style.color = 'var(--red)';
    errEl.textContent = 'Ошибка: ' + e.message;
    btn.disabled = false;
  }
}

async function manualPull() {
  const status = document.getElementById('settingsStatus');
  status.style.display = 'block';
  status.textContent = 'Загружаю...';
  try {
    await syncFromCloud();
    status.textContent = 'Готово!';
    showToast('Загружено из облака');
    setTimeout(() => { status.style.display = 'none'; }, 2000);
    renderSettings();
  } catch(e) {
    status.textContent = 'Ошибка: ' + e.message;
  }
}

async function manualPush() {
  const status = document.getElementById('settingsStatus');
  status.style.display = 'block';
  status.textContent = 'Выгружаю...';
  try {
    await updateGistData(getHistory());
    localStorage.setItem(SYNC_KEY, new Date().toISOString());
    status.textContent = 'Готово!';
    showToast('Выгружено в облако');
    setTimeout(() => { status.style.display = 'none'; }, 2000);
    renderSettings();
  } catch(e) {
    status.textContent = 'Ошибка: ' + e.message;
  }
}

function disconnectGist() {
  if (!confirm('Отключить синхронизацию? Локальные данные останутся.')) return;
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(GIST_KEY);
  localStorage.removeItem(SYNC_KEY);
  renderSettings();
  showToast('Отключено');
}

document.getElementById('modalSettings').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('open');
});
